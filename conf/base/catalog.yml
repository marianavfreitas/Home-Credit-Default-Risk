# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

# Pandas CSVDataSet 
application_train_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/application_train.csv

application_test_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/application_test.csv

bureau_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/bureau.csv

bureau_balance_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/bureau_balance.csv

previous_application_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/previous_application.csv

POS_CASH_balance_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/POS_CASH_balance.csv

installments_payments_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/installments_payments.csv

credit_card_balance_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/credit_card_balance.csv

# ParquetDataSet

application_train_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/application_train.parquet  

application_test_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/application_test.parquet

bureau_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/bureau.parquet

bureau_balance_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/bureau_balance.parquet

previous_application_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/previous_application.parquet

POS_CASH_balance_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/POS_CASH_balance.parquet

installments_payments_processed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/installments_payments.parquet  

credit_card_balance_processed:
  type: pandas.ParquetDataset         
  filepath: data/02_intermediate/credit_card_balance.parquet

# Feature Engineering - aggregation of applications
previous_application_agg:
  type: pandas.ParquetDataset
  filepath: data/04_feature/previous_application_agg.parquet

# Splitting the data into train and test sets

X_train:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_train.parquet

X_test:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_test.parquet

y_train:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/y_train.parquet

y_test:
  type: pandas.ParquetDataset 
  filepath: data/05_model_input/y_test.parquet

# Missing Value Treatment

X_train_imputed:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_train_imputed.parquet

X_test_imputed:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_test_imputed.parquet

# Capping outliers

X_train_capped:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_train_capped.parquet

X_test_capped:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_test_capped.parquet




